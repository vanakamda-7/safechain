name: safetchain
description: SafeChain - A privacy-first women's safety and guardian response app.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
    shake: ^3.0.0
  flutter_local_notifications: ^17.2.3
  crypto: ^3.0.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
